  saveSet:async()=>{const s=clean(setDraft);['kcal','protein','carbs','fat','goalKg','weekly'].forEach(k=>{const v=num(s[k]);s[k]=v==null?DEFAULTS[k]:v});if(!isDate(s.goalDate))s.goalDate=DEFAULTS.goalDate;['workStart','workEnd'].forEach(k=>{if(s[k]&&hm(s[k])==null)s[k]=DEFAULTS[k]});if(String(setDraft.ouraSheetId||'').trim()&&!sheetIdFrom(setDraft.ouraSheetId)){toast('That doesn’t look like a Google Sheet link or ID. Paste the full link from the sheet’s address bar.');return}s.ouraSheetId=sheetIdFrom(s.ouraSheetId);s.confirmed=true;s.stack=s.stack.filter(x=>x.name&&x.name.trim()).map(x=>({name:x.name.trim(),dose:(x.dose||'').trim(),when:(x.when||'').trim()}));
    const newSheet=s.ouraSheetId&&s.ouraSheetId!==S.settings.ouraSheetId;
    if(await safe(()=>saveSettings(s),'Setup saved')){setDraft=clean(S.settings);render();if(newSheet)syncOuraSheet(true)}},
  syncOura:()=>syncOuraSheet(true),
  resync:()=>{if(!S.settings.ouraSheetId){toast('Link your Oura sheet in Setup first');tab='setup';render();return}syncOuraSheet(true)},
  openChat:()=>openChat(),chatSend:()=>chatSend(),chatAsk:b=>chatSend(b.dataset.q),chatClear:()=>{chat=[];chatSave();render()},
  genDaily:()=>genDaily(true),callHistory:()=>openHistory(),callToggle:()=>{callOpen=!callOpen;render()},
  resetSet:()=>{setDraft=clean(S.settings);render()},

  dlSum:()=>download('recomp-log-summary-'+today()+'.txt',$('#sumTxt').value),
  exportJson:async()=>{if(await download('recomp-log-backup-'+today()+'.json',JSON.stringify(backupObj(),null,1)))toast('Backup saved')}
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');
  if(!b){if(e.target===$('#sheet'))requestClose();return}
  if(b.tagName==='SELECT'||b.tagName==='INPUT')return;
  const f=A[b.dataset.a];if(f){e.preventDefault();f(b,e)}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#sheet').hidden)requestClose();
  if(e.key==='Tab'&&!$('#sheet').hidden){const f=[...$('#sheet').querySelectorAll('button,input,select,textarea,summary,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled&&x.offsetParent!==null);if(f.length){const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}else if(!$('#sheet').contains(document.activeElement)){e.preventDefault();a.focus()}}}
  if(e.key==='Enter'&&e.target.id==='wIn'){e.preventDefault();A.saveW()}
});
document.addEventListener('input',e=>{
  if(e.target.id==='fsQ'){foodSearch(e.target.value);return}
  if(e.target.id==='ovR'){ovPos=+e.target.value;const t=document.querySelector('.ov-top'),l=document.querySelector('.ov-line');if(t)t.style.clipPath=`inset(0 0 0 ${ovPos}%)`;if(l)l.style.left=ovPos+'%';return}
  if(e.target.id==='againQ'){const q=e.target.value.trim().toLowerCase();document.querySelectorAll('.again-l li').forEach(l=>{l.hidden=q?!l.dataset.q.includes(q):(!againAll&&l.classList.contains('more-row'))});const x=document.querySelector('.again-all');if(x)x.hidden=!!q;return}
  if(e.target.id==='chatIn'){chatDraft=e.target.value;return}
  const el=e.target,ds=el.dataset;
  if($('#sheet').contains(el)&&!['sumDays','sumDetail'].includes(el.id))sheetDirty=true;
  if(ds.k!==undefined&&ds.wi!==undefined&&drafts){const w=drafts[+ds.wi];if(!w)return;const t=ds.ei!==undefined?w.exercises[+ds.ei]:w;if(t)t[ds.k]=ds.t==='n'?num(el.value):el.value}
  else if(ds.mk==='g'&&mealDraft){const it=mealDraft.items[+ds.mi],g=num(el.value);if(it&&it.p100&&g>0){it.amount=g+' g';Object.assign(it,scale100(it.p100,g));['kcal','protein','carbs','fat'].forEach(k=>{const x=document.querySelector(`[data-mi="${ds.mi}"][data-mk="${k}"]`);if(x)x.value=it[k]});updateMealTotal()}}
  else if(ds.mk!==undefined&&mealDraft){const it=mealDraft.items[+ds.mi];if(it){it[ds.mk]=ds.t==='n'?num(el.value):el.value;updateMealTotal()}}
  else if(ds.sk!==undefined&&setDraft){setDraft[ds.sk]=el.value;const mn=$('#macroNote');if(mn&&['kcal','protein','carbs','fat'].includes(ds.sk))mn.innerHTML=macroNote(setDraft)}
  else if(ds.si!==undefined&&setDraft){const x=setDraft.stack[+ds.si];if(x)x[ds.sf]=el.value}
  const sb=$('#saveBar');if(sb)sb.hidden=!setDirty();
});
function thumbs(target,files){const t=$(target);if(!t)return;t.querySelectorAll('img').forEach(i=>URL.revokeObjectURL(i.src));t.innerHTML='';files.forEach(f=>{const i=document.createElement('img');i.alt='';i.src=URL.createObjectURL(f);t.appendChild(i)})}
document.addEventListener('change',e=>{
  if(e.target.id==='lx_kind'){labKindChange();return}
  if(e.target.id==='cmpPick'){cmpA=e.target.value;render();return}
  if(e.target.dataset&&e.target.dataset.pose){const pose=e.target.dataset.pose,f=e.target.files&&e.target.files[0],slot=document.getElementById('slot-'+pose);if(!f||!slot)return;
    slot.classList.add('busy');shrinkImage(f,1400).then(sm=>{if(bodyNew[pose])URL.revokeObjectURL(bodyNew[pose].url);const url=URL.createObjectURL(sm);bodyNew[pose]={blob:sm,url};sheetDirty=true;
      const img=slot.querySelector('img')||slot.insertBefore(document.createElement('img'),slot.firstChild);img.src=url;const add=slot.querySelector('.ph-add');if(add)add.remove();slot.classList.remove('busy');e.target.value=''})
      .catch(()=>{slot.classList.remove('busy');toast('Couldn’t read that photo. Try again.')});return}
  const el=e.target;
  if(el.id==='exPick'){exSel=el.value;render();return}
  if(el.id==='scanIn'){scanFiles=[...el.files].slice(0,MAXIMG);thumbs('#thumbs',scanFiles);$('#scanGo').disabled=!scanFiles.length;if(scanFiles.length){sheetDirty=true;Promise.all(scanFiles.map(f=>shrinkImage(f,2200))).then(fs=>{scanFiles=fs;runScan()})}if(el.files.length>MAXIMG)$('#scanMsg').textContent=`Using the first ${MAXIMG}; scan the rest after.`;return}
  if(el.id==='mealPhoto'){syncMealHead();const f=el.files[0];if(!f)return;sheetDirty=true;const sp=el.parentElement.querySelector('span');if(sp)sp.textContent='Photo added · reading it…';shrinkImage(f).then(x=>{mealFile=x;estMeal()});return}
  if(el.id==='ouraShot'){ouraShots=[...el.files].slice(0,MAXIMG);thumbs('#oThumbs',ouraShots);$('#oGo').disabled=!ouraShots.length;return}
  if(el.id==='fbFile'){const f=el.files[0];if(!f)return;$('#fbOut').innerHTML=`<p class="note">${busy('Reading file…')}</p>`;f.text().then(t=>{fbParsed=parseFitbod(t);fbPreview()}).catch(()=>{fbParsed={error:'Couldn’t read that file.'};fbPreview()});return}
  if(el.id==='fbRep'){fbReplace=el.checked;return}
  if(el.id==='ouraFile'){if(el.files.length)importOuraFiles([...el.files]);return}
  if(el.id==='restoreIn'){if(el.files[0])restore(el.files[0]);el.value='';return}
  if(el.id==='sumDays'||el.id==='sumDetail'){openSummary(+$('#sumDays').value,$('#sumDetail').checked);return}
  if(el.id==='m_slot'||el.id==='m_date'||el.id==='m_at'){syncMealHead();return}
  if(el.id==='c_kind'){$('#c_distL').hidden=!DIST_KINDS.includes(el.value);return}
});
setInterval(()=>{const t=today();if(t!==render._day){if(render._day&&sel===render._day)sel=t;render._day=t;dailyTried=false;dailyErr='';callOpen=null;schedule()}},60000);render._day=today();
